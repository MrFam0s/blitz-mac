# Modified for the AmoSystems Blitz Neo maintenance fork (2026).
name: Build & Verify

on:
  workflow_dispatch:

# Public DMGs are published explicitly as documented in docs/public-release.md.
permissions:
  contents: read

env:
  BLITZ_SWIFT_BUILD_SYSTEM: native
  CODESIGN_TIMESTAMP: none

jobs:
  build:
    # Standard runners are free only while this repository is public.
    if: github.event.repository.private == false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/App-Store-Connect-CLI-helper/go.mod
          cache: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-toolchain

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Swift tests
        run: swift test --build-system native

      - name: Bundle .app
        run: |
          APPLE_SIGNING_IDENTITY="-" bash scripts/bundle.sh release

      - name: Generate checksums
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent "Blitz Neo.app" BlitzNeo.app.zip
          shasum -a 256 BlitzNeo.app.zip > BlitzNeo.app.zip.sha256
          cat BlitzNeo.app.zip.sha256

  build_x86_64:
    # Standard runners are free only while this repository is public.
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/App-Store-Connect-CLI-helper/go.mod
          cache: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-toolchain

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Bundle .app
        run: |
          APPLE_SIGNING_IDENTITY="-" bash scripts/bundle.sh release

      - name: Generate checksums
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent "Blitz Neo.app" BlitzNeo-x86_64.app.zip
          shasum -a 256 BlitzNeo-x86_64.app.zip > BlitzNeo-x86_64.app.zip.sha256
          cat BlitzNeo-x86_64.app.zip.sha256
